    <h1>android 17 - ACCESS_LOCAL_NETWORK</h1>

    <div>
                    <article>
                                <div class="PostUser"><h3 class="PostUser-name">cherepavel</h3></div>
                <div class="Post-body">
                    <p>Android 17 will finally feature protection against loopback 127.0.0.1, through which apps send all sorts of information to each other.<br>
<a href="https://developer.android.com/reference/android/Manifest.permission#ACCESS_LOCAL_NETWORK" rel="ugc nofollow">https://developer.android.com/reference/android/Manifest.permission#ACCESS_LOCAL_NETWORK</a></p>
                </div>
            </article>

            <hr>
                    <article>
                                <div class="PostUser"><h3 class="PostUser-name">DeletedUser728</h3></div>
                <div class="Post-body">
                    <p><a href="https://discuss.grapheneos.org/d/33471-android-17-access-local-network/1" class="PostMention" data-id="222007"><i class="icon fas fa-reply"></i>cherepavel</a> so it's only IPC left unprotected</p> 
                </div>
            </article>

            <hr>
                    <article>
                                <div class="PostUser"><h3 class="PostUser-name">Elysium</h3></div>
                <div class="Post-body">
                    <p><a href="https://developer.android.com/privacy-and-security/local-network-definition" rel="ugc nofollow">https://developer.android.com/privacy-and-security/local-network-definition</a></p>

<p>Hm, is localhost even in their definition of local network? I am no expert with networking etc. Doesn't seem like it?</p>

<blockquote><p>A local network in this project refers to an IP network that utilizes a<br>
broadcast-capable network interface, such as Wi-Fi or Ethernet, but excludes<br>
cellular (WWAN) or VPN connections.</p>

<ul><li>169.254.0.0/16 //Link Local</li>
<li>100.64.0.0/10 // CGNAT</li>
<li>10.0.0.0/8 // RFC1918</li>
<li>172.16.0.0/12 // RFC1918</li>
<li>192.168.0.0/16 // RFC1918</li>
<li>Link-local</li>
<li>Directly-connected routes</li>
<li>Stub networks like Thread</li>
<li>Multiple-subnets<br>
Additionally, both multicast addresses (224.0.0.0/4, ff00::/8) and the IPv4<br>
broadcast address (255.255.255.255) are classified as local network addresses.</li></ul></blockquote>

<p>While local is 127.0.0.1 ?</p>
                </div>
            </article>

            <hr>
                    <article>
                                <div class="PostUser"><h3 class="PostUser-name">DeletedUser728</h3></div>
                <div class="Post-body">
                    <p><a href="https://discuss.grapheneos.org/d/33471-android-17-access-local-network/3" class="PostMention" data-id="222024"><i class="icon fas fa-reply"></i>Elysium</a> indeed, thank you. None of loopback, 127.0.0.1 is mentioned either there or here <a href="https://developer.android.com/privacy-and-security/local-network-permission" rel="ugc nofollow">https://developer.android.com/privacy-and-security/local-network-permission</a></p>

<p>So OP seems to be wrong or hasn't provided enough evidence.</p> 

<p><a href="https://discuss.grapheneos.org/u/cherepavel" class="UserMention">@cherepavel</a>?</p> 
                </div>
            </article>

            <hr>
                    <article>
                                <div class="PostUser"><h3 class="PostUser-name">xbxbz</h3></div>
                <div class="Post-body">
                    <p><a href="https://discuss.grapheneos.org/d/33471-android-17-access-local-network/1" class="PostMention" data-id="222007"><i class="icon fas fa-reply"></i>cherepavel</a></p> 

<p>The Android 17 ACCESS_LOCAL_NETWORK permission does not solve the cross-profile localhost communication issue described in GrapheneOS/os-issue-tracker#4768.</p> 

<p>The vulnerability allows apps in separate user profiles to communicate over 127.0.0.1, bypassing profile isolation.</p>

<p>This occurs because Android shares the network namespace across profiles, enabling localhost connections between them.</p>

<p>The ACCESS_LOCAL_NETWORK permission only controls discovery of devices on the local network (e.g., LAN), not loopback interface (localhost) access.</p>

<p>The real fix requires separate network namespaces per user profile, which is not implemented in Android 17.</p>
                </div>
            </article>
