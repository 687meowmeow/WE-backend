# JVM settings — kept very small for low-RAM build environments (3.9 GB total)
# 1.5 GB heap + 256 MB metaspace = fits in available 1.9 GB
org.gradle.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Compose — official stable compiler artifact since Kotlin 2.0
android.compose.compileCompilerReportDestination=build/compose-reports
android.compose.compileMetricsDestination=build/compose-metrics

# Native — we only ship arm64-v8a (flagship Snapdragon 8 Gen 2+ target)
android.prefab=true

# Parallel + caching (CI overrides these)
# Disabled parallel on low-RAM envs to avoid OOM during dexing
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Non-transitive R classes — faster builds, smaller APK
android.nonTransitiveRClass=true
