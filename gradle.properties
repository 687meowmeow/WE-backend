# JVM settings — defaults good for CI runners (have ~7 GB RAM)
# Local low-RAM builds can override with GRADLE_OPTS=-Dorg.gradle.jvmargs="..."
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Compose — official stable compiler artifact since Kotlin 2.0
android.compose.compileCompilerReportDestination=build/compose-reports
android.compose.compileMetricsDestination=build/compose-metrics

# Native — we only ship arm64-v8a (flagship Snapdragon 8 Gen 2+ target)
android.prefab=true

# Parallel + caching (CI overrides these)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Non-transitive R classes — faster builds, smaller APK
android.nonTransitiveRClass=true
