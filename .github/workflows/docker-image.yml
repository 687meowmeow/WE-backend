name: Build & push GHCR builder image

# Build the docker image that contains all the build toolchains (NDK, SDK, Wine build deps, etc.)
# This image is huge (~10 GB) — built weekly OR on Dockerfile changes only.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
  schedule:
    - cron: '0 4 * * 1'  # Monday 4am UTC — weekly rebuild
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Docker image names MUST be lowercase — github.repository preserves case
# (687meowmeow/WE-backend has uppercase W and E). We compute a lowercase
# version in a step below and use that everywhere.

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name (Docker requires lowercase)
        id: img
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$REPO_LC/builder" >> $GITHUB_OUTPUT
          echo "registry_ref=ghcr.io/$REPO_LC/builder" >> $GITHUB_OUTPUT
          echo "Resolved image name: ghcr.io/$REPO_LC/builder"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/
          file: docker/Dockerfile.builder
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.img.outputs.registry_ref }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.registry_ref }}:buildcache,mode=max
