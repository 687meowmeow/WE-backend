name: Build WepWawet APK

on:
  push:
    # v0.6.0-alpha: workflow now triggers on BOTH dev-branch pushes AND tag pushes.
    # This is needed because v0.6.0-alpha is a major parity release that the user
    # wants CI to verify builds successfully.
    branches: [ dev, main ]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tag:
    name: Check for duplicate tag run
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if commit has a v* tag
        id: check
        run: |
          TAG=$(curl -sS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/tags?per_page=100" | \
            python3 -c "
          import sys, json
          tags = json.load(sys.stdin)
          sha = '${{ github.sha }}'
          for t in tags:
              if t['commit']['sha'] == sha and t['name'].startswith('v'):
                  print(t['name'])
                  break
          " 2>/dev/null || true)
          echo "Found tag: '${TAG}'"
          if [ "${{ github.ref_type }}" = "branch" ] && [ -n "$TAG" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build-apk:
    name: Build APK
    needs: check-tag
    if: needs.check-tag.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find-apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wepwawet-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [check-tag, build-apk]
    if: needs.check-tag.outputs.skip != 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wepwawet-apk
          path: release/

      - name: Find APK
        id: find
        run: |
          APK=$(find release -name '*.apk' | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -lh release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.apk }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
