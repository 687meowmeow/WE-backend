[versions]
agp = "8.7.0"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigation = "2.8.3"
serialization = "1.7.3"
okhttp = "4.12.0"
retrofit = "2.11.0"
retrofitKotlinxSerialization = "1.0.0"
coil = "2.7.0"
workManager = "2.9.1"
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
# JavaSteam — Java/Kotlin port of SteamKit2 for direct Steam protocol access
# Using the WepWawet fork (com.github.687meowmeow:JavaSteam) instead of
# the upstream in.dragonbra version because we patched the
# SupportedWorkshopFileTypes set to include EWorkshopFileType.First.
# Without this patch, Steam returns fileType=0 for some Wallpaper Engine
# workshop items (e.g., 3823357259) and the library skips the file
# silently — causing awaitCompletion to hang forever.
javasteam = "v1.8.0-wepwawet8"
bouncycastle = "1.84"
# zstd-jni — required by JavaSteam DepotDownloader for Zstd decompression of
# depot chunks. Without this, the download crashes with NoClassDefFoundError
# when trying to decompress downloaded chunks.
# Version matches the JavaSteam fork's libs.versions.toml.
zstdJni = "1.5.7-6"
# XZ — required by JavaSteam for LZMA decompression of some depot chunks.
xz = "1.11"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerialization" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

# JavaSteam — downloads workshop items via Steam binary protocol (no PC required)
# Using WepWawet fork on JitPack (com.github.687meowmeow) instead of upstream
# in.dragonbra — see comment on the version declaration above for why.
javasteam-core = { group = "com.github.687meowmeow.JavaSteam", name = "javasteam", version.ref = "javasteam" }
javasteam-depotdownloader = { group = "com.github.687meowmeow.JavaSteam", name = "javasteam-depotdownloader", version.ref = "javasteam" }
bouncycastleProvider = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
# zstd-jni — Zstd decompression for Steam depot chunks (required by JavaSteam)
# MUST use the AAR (not JAR) on Android — the JAR only includes Linux/macOS/Windows
# native libs (compiled with glibc), which don't load on Android (bionic libc).
# The AAR includes Android-compatible .so files for arm64-v8a etc.
zstdJni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }
# XZ — LZMA decompression for some Steam depot chunks (required by JavaSteam)
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
